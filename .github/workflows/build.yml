name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Test and build debug APKs
        run: ./gradlew :core:test assembleDebug

      # Every release is signed with the same key, so updates install over the old version
      # without losing settings. See docs/signing.md.
      - name: Build signed release APKs
        if: github.ref == 'refs/heads/main'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are missing. See docs/signing.md."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          SIGNING_KEYSTORE_PATH="$RUNNER_TEMP/release.jks" ./gradlew assembleRelease

      - name: Upload signed APKs
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: apks
          path: app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error
